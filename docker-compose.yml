services:
  mechatronics-elearning:
    build: .
    image: en-132-012-mechatronics-elearning:latest
    container_name: en-132-012-mechatronics-elearning
    ports:
      - "8040:3000"
    restart: unless-stopped
    volumes:
      - visitor-stats:/app/data   # เก็บสถิติการเข้าใช้ถาวร ไม่หายเมื่อ build ใหม่

volumes:
  visitor-stats:
